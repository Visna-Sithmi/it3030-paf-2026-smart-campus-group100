# Server Configuration
spring.application.name=backend
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/northbridge_university_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.multipart=DEBUG

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Image upload configuration - CRITICAL
image.upload.directory=uploads/resources

# Multipart file upload settings - CRITICAL
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

spring.jackson.property-naming-strategy=SNAKE_CASE